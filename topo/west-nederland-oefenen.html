<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>West-Nederland: Plaatsen Oefenen</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--oranje:#e8500a;--lichtoranje:#f9a55a;--blauw:#2c6fb5;--lichtblauw:#5b9bd5;--goed:#27ae60;--fout:#e74c3c;--bg:#fef9f4;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:var(--bg);min-height:100vh;padding:16px;max-width:980px;margin:0 auto;}

header{background:linear-gradient(135deg,var(--oranje),#c0392b);color:white;border-radius:20px;padding:18px 24px;margin-bottom:16px;display:flex;align-items:center;gap:14px;box-shadow:0 6px 24px rgba(232,80,10,.25);}
.logo{width:52px;height:52px;background:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',cursive;font-weight:800;font-size:12px;color:var(--oranje);text-align:center;line-height:1.1;flex-shrink:0;}
header h1{font-family:'Baloo 2',cursive;font-size:1.7rem;font-weight:800;}
header p{font-size:.9rem;opacity:.9;margin-top:3px;}

.score-bar{background:white;border-radius:14px;padding:12px 20px;margin-bottom:14px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;box-shadow:0 2px 12px rgba(0,0,0,.08);}
.score-item .num{font-family:'Baloo 2',cursive;font-size:1.8rem;font-weight:800;line-height:1;}
.score-item .label{font-size:.7rem;color:#777;font-weight:600;text-transform:uppercase;letter-spacing:.5px;}
.score-item.goed .num{color:var(--goed);} .score-item.fout .num{color:var(--fout);} .score-item.resterend .num{color:var(--blauw);}
.score-progress{flex:1;min-width:120px;}
.progress-track{height:10px;background:#e8e8e8;border-radius:99px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--goed),#52d68a);border-radius:99px;transition:width .5s;width:0%;}
.progress-label{font-size:.75rem;color:#888;margin-top:3px;font-weight:600;}

/* TABS */
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.tab-btn{padding:10px 20px;border:2.5px solid var(--blauw);background:white;color:var(--blauw);border-radius:30px;font-family:'Nunito',sans-serif;font-size:.92rem;font-weight:700;cursor:pointer;transition:all .2s;}
.tab-btn.actief{background:var(--blauw);color:white;}

/* SUB-TABS for intypen/meerkeuze */
.sub-tabs{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap;}
.sub-btn{padding:8px 16px;border:2px solid #ccc;background:white;color:#666;border-radius:25px;font-family:'Nunito',sans-serif;font-size:.85rem;font-weight:700;cursor:pointer;transition:all .2s;}
.sub-btn.actief{border-color:var(--oranje);background:var(--oranje);color:white;}

/* ══ SLEPEN ══ */
.slepen-layout{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px;}

.kaart-sectie{background:white;border-radius:18px;padding:16px;box-shadow:0 4px 20px rgba(0,0,0,.07);flex:1 1 320px;}
.kaart-sectie h3{font-family:'Baloo 2',cursive;font-weight:700;color:var(--blauw);margin-bottom:10px;font-size:.95rem;}
.kaart-wrapper{position:relative;width:100%;border-radius:12px;overflow:hidden;border:2px solid #ccc;user-select:none;}
.kaart-wrapper img{width:100%;display:block;pointer-events:none;}

/* Drop zones on map */
.drop-zone{
  position:absolute;width:48px;height:22px;
  border-radius:4px;border:2px dashed #888;
  background:rgba(255,255,255,.75);
  transform:translate(-50%,-50%);
  display:flex;align-items:center;justify-content:center;
  font-family:'Nunito',sans-serif;font-size:8px;font-weight:700;color:#aaa;
  transition:all .15s;z-index:3;white-space:nowrap;overflow:hidden;padding:0 2px;
  cursor:default;
}
.drop-zone.drag-over{border-color:var(--blauw);background:rgba(44,111,181,.25);transform:translate(-50%,-50%) scale(1.1);}
.drop-zone.correct{border-color:var(--goed) !important;background:var(--goed);color:white;font-size:7.5px;border-style:solid;font-weight:800;text-shadow:0 1px 2px rgba(0,0,0,.3);}
.drop-zone.correct:hover{background:#1e8449;z-index:20;}
.drop-zone.incorrect{border-color:var(--fout) !important;background:rgba(231,76,60,.18);color:#c0392b;font-size:7.5px;border-style:solid;font-weight:800;}

/* Naam chips */
.naam-bank{background:white;border-radius:18px;padding:16px;box-shadow:0 4px 20px rgba(0,0,0,.07);flex:0 0 210px;}
.naam-bank h3{font-family:'Baloo 2',cursive;font-weight:700;color:var(--blauw);margin-bottom:10px;font-size:.95rem;}
.chip-list{display:flex;flex-direction:column;gap:6px;}
.naam-chip{
  padding:7px 12px;border-radius:8px;
  background:var(--oranje);color:white;
  font-family:'Nunito',sans-serif;font-size:.82rem;font-weight:700;
  cursor:grab;box-shadow:0 2px 6px rgba(0,0,0,.2);
  transition:transform .1s,opacity .15s;user-select:none;touch-action:none;
  white-space:nowrap;
}
.naam-chip:active{cursor:grabbing;}
.naam-chip.dragging{opacity:.35;}
.naam-chip.gebruikt{opacity:.2;cursor:default;pointer-events:none;text-decoration:line-through;}

/* ══ INTYPEN/MEERKEUZE ══ */
.vraag-kaart{background:white;border-radius:18px;padding:20px;margin-bottom:12px;box-shadow:0 3px 14px rgba(0,0,0,.07);border:2px solid transparent;transition:border-color .3s;}
.vraag-kaart.correct{border-color:var(--goed);} .vraag-kaart.incorrect{border-color:var(--fout);}
.vraag-header{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.nummer-badge{width:38px;height:38px;background:linear-gradient(135deg,var(--oranje),var(--lichtoranje));border-radius:9px;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',cursive;font-weight:800;font-size:1rem;color:white;flex-shrink:0;}
.vraag-tekst{font-size:.95rem;font-weight:700;color:#333;flex:1;}
.feedback-icon{font-size:1.3rem;display:none;}
.correct .feedback-icon,.incorrect .feedback-icon{display:block;}
.invoer-veld{width:100%;padding:10px 13px;border:2.5px solid #ddd;border-radius:10px;font-family:'Nunito',sans-serif;font-size:.95rem;font-weight:600;outline:none;transition:border-color .2s;}
.invoer-veld:focus{border-color:var(--blauw);}
.invoer-veld.correct{border-color:var(--goed);background:#f0fff5;color:var(--goed);}
.invoer-veld.incorrect{border-color:var(--fout);background:#fff5f5;color:var(--fout);}
.opties-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.optie-btn{padding:10px 13px;border:2.5px solid #e0e0e0;background:white;border-radius:10px;font-family:'Nunito',sans-serif;font-size:.88rem;font-weight:700;cursor:pointer;text-align:left;transition:all .15s;color:#333;}
.optie-btn:hover:not(:disabled){border-color:var(--blauw);background:#f0f6ff;}
.optie-btn.goed{border-color:var(--goed);background:#f0fff5;color:var(--goed);}
.optie-btn.fout{border-color:var(--fout);background:#fff5f5;color:var(--fout);}
.optie-btn:disabled{cursor:default;}
.antwoord-hint{margin-top:8px;padding:8px 12px;background:#fff8e6;border-radius:9px;font-size:.85rem;font-weight:600;color:#c0922a;display:none;}

/* Kaart mini (in intypen tab) */
.kaart-mini-sectie{background:white;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 4px 20px rgba(0,0,0,.07);}
.kaart-mini-sectie h3{font-family:'Baloo 2',cursive;font-weight:700;color:var(--blauw);margin-bottom:8px;font-size:.95rem;}
.kaart-mini-wrapper{position:relative;width:100%;border-radius:12px;overflow:hidden;border:2px solid #ccc;}
.kaart-mini-wrapper img{width:100%;display:block;}
.mini-pin{position:absolute;width:24px;height:24px;border-radius:50%;background:var(--oranje);border:2px solid white;color:white;font-family:'Baloo 2',cursive;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;transform:translate(-50%,-50%);box-shadow:0 1px 5px rgba(0,0,0,.35);cursor:pointer;transition:all .15s;z-index:4;}
.mini-pin:hover{transform:translate(-50%,-50%) scale(1.25);z-index:10;}
.mini-pin.correct-pin{background:var(--goed);}
.mini-pin.fout-pin{background:var(--fout);}
.mini-pin.actief-pin{transform:translate(-50%,-50%) scale(1.35);box-shadow:0 0 0 3px rgba(44,111,181,.5);}

.knoppen-rij{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;justify-content:center;}
.knop{padding:10px 24px;border:none;border-radius:30px;font-family:'Baloo 2',cursive;font-size:.92rem;font-weight:700;cursor:pointer;transition:all .2s;box-shadow:0 3px 10px rgba(0,0,0,.12);}
.knop:hover{transform:translateY(-2px);}
.knop-check{background:var(--blauw);color:white;} .knop-opnieuw{background:var(--oranje);color:white;} .knop-toon{background:#888;color:white;}

.einde-scherm{display:none;text-align:center;background:white;border-radius:20px;padding:32px;box-shadow:0 4px 24px rgba(0,0,0,.1);margin-bottom:16px;}
.einde-scherm h2{font-family:'Baloo 2',cursive;font-size:1.9rem;font-weight:800;margin-bottom:8px;}
.eindcijfer{font-family:'Baloo 2',cursive;font-size:3.2rem;font-weight:800;color:var(--oranje);margin:8px 0;}

/* Ghost */
#drag-ghost{position:fixed;pointer-events:none;z-index:9999;display:none;padding:7px 12px;border-radius:8px;background:var(--oranje);color:white;font-family:'Nunito',sans-serif;font-size:.82rem;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.35);transform:translate(-50%,-50%);white-space:nowrap;}

@media(max-width:600px){
  .slepen-layout{flex-direction:column;}
  .naam-bank{flex:none;width:100%;}
  .chip-list{flex-direction:row;flex-wrap:wrap;}
  .naam-chip{font-size:.75rem;padding:5px 9px;}
  .opties-grid{grid-template-columns:1fr;}
}

/* Popup */
#drop-popup{position:fixed;z-index:10000;background:white;border-radius:16px;padding:18px 22px;box-shadow:0 8px 32px rgba(0,0,0,.22);pointer-events:none;display:none;text-align:center;min-width:180px;}
#drop-popup .popup-icon{font-size:2rem;margin-bottom:6px;}
#drop-popup .popup-fout{font-size:.85rem;color:var(--fout);font-weight:700;margin-bottom:8px;}
#drop-popup .popup-correct-label{font-size:.75rem;color:#888;margin-bottom:3px;}
#drop-popup .popup-correct-naam{font-size:1.15rem;font-weight:800;color:var(--goed);}
</style>
</head>
<body>
<div id="drag-ghost"></div>
<div id="map-tooltip" style="position:fixed;z-index:9998;background:#222;color:white;padding:5px 10px;border-radius:8px;font-size:.8rem;font-weight:700;pointer-events:none;display:none;transform:translate(-50%,-100%);white-space:nowrap;"></div>
<div id="drop-popup">
  <div class="popup-icon" id="popup-icon"></div>
  <div class="popup-fout" id="popup-fout"></div>
  <div class="popup-correct-label" id="popup-correct-label"></div>
  <div class="popup-correct-naam" id="popup-correct-naam"></div>
</div>

<header>
  <div class="logo">Junior<br>Einstein</div>
  <div><h1>West-Nederland: Plaatsen</h1><p>Oefen de 19 plaatsen van West-Nederland</p></div>
</header>

<div class="score-bar">
  <div class="score-item goed"><div class="num" id="score-goed">0</div><div class="label">Goed ✓</div></div>
  <div class="score-item fout"><div class="num" id="score-fout">0</div><div class="label">Fout ✗</div></div>
  <div class="score-item resterend"><div class="num" id="score-rest">19</div><div class="label">Resterend</div></div>
  <div class="score-progress">
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="progress-label" id="progress-label">0 van 19 goed</div>
  </div>
</div>

<div class="tabs">
  <button class="tab-btn actief" onclick="setTab('slepen')">🖱️ Slepen</button>
  <button class="tab-btn" onclick="setTab('intypen')">✏️ Intypen</button>
  <button class="tab-btn" onclick="setTab('meerkeuze')">🔘 Meerkeuze</button>
</div>

<div id="main-content"></div>

<div class="knoppen-rij">
  <button class="knop knop-check" id="btn-check" onclick="controleerAlles()">✔ Controleer alles</button>
  <button class="knop knop-opnieuw" onclick="opnieuw()">🔄 Opnieuw</button>
  <button class="knop knop-toon" onclick="toonAntwoorden()">👁 Toon antwoorden</button>
</div>

<div class="einde-scherm" id="einde-scherm">
  <div style="font-size:2.5rem">🎉</div><h2>Klaar!</h2>
  <div class="eindcijfer" id="eindcijfer">0/19</div>
  <p id="einde-bericht" style="font-size:1rem;color:#555;"></p>
  <div class="knoppen-rij" style="justify-content:center;margin-top:14px;">
    <button class="knop knop-opnieuw" onclick="opnieuw()">🔄 Nog een keer</button>
  </div>
</div>

<script>
const plaatsen = [{nr:1,naam:"Den Helder",lx:"46.4%",ly:"1.4%"},{nr:2,naam:"Alkmaar",lx:"44.5%",ly:"29.9%"},{nr:3,naam:"Enkhuizen",lx:"63.0%",ly:"21.1%"},{nr:4,naam:"Purmerend",lx:"55.0%",ly:"33.7%"},{nr:5,naam:"Zaandam",lx:"47.0%",ly:"38.1%"},{nr:6,naam:"Haarlem",lx:"38.7%",ly:"45.5%"},{nr:7,naam:"Amsterdam",lx:"46.1%",ly:"49.5%"},{nr:8,naam:"Amstelveen",lx:"50.8%",ly:"52.6%"},{nr:9,naam:"Hilversum",lx:"60.0%",ly:"55.9%"},{nr:10,naam:"Leiden",lx:"36.1%",ly:"59.0%"},{nr:11,naam:"Den Haag",lx:"30.8%",ly:"65.0%"},{nr:12,naam:"Delft",lx:"32.8%",ly:"69.7%"},{nr:13,naam:"Zoetermeer",lx:"35.9%",ly:"65.9%"},{nr:14,naam:"Alphen aan den Rijn",lx:"43.7%",ly:"61.5%"},{nr:15,naam:"Rotterdam",lx:"36.1%",ly:"75.4%"},{nr:16,naam:"Gouda",lx:"43.3%",ly:"72.5%"},{nr:17,naam:"Dordrecht",lx:"43.7%",ly:"85.6%"},{nr:18,naam:"Utrecht",lx:"58.3%",ly:"64.7%"},{nr:19,naam:"Amersfoort",lx:"66.1%",ly:"59.5%"}];
let tab = 'slepen';
let scoreGoed = 0, scoreFout = 0, beantwoord = new Set();
let dragNr = null, dragEl = null;
const ghost = document.getElementById('drag-ghost');

/* ══ DRAG ENGINE ══ */
function startDrag(e, nr, el) {
  if (beantwoord.has(nr)) return;
  dragNr = nr; dragEl = el;
  el.classList.add('dragging');
  const p = plaatsen.find(x => x.nr === nr);
  ghost.textContent = p.naam;
  ghost.style.display = 'block';
  moveGhost(e);
  e.preventDefault();
}
function moveGhost(e) {
  const cx = e.touches ? e.touches[0].clientX : e.clientX;
  const cy = e.touches ? e.touches[0].clientY : e.clientY;
  ghost.style.left = cx + 'px'; ghost.style.top = cy + 'px';
}
function endDrag(e) {
  ghost.style.display = 'none';
  if (dragEl) dragEl.classList.remove('dragging');
  if (dragNr === null) return;
  const cx = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
  const cy = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
  const els = document.elementsFromPoint(cx, cy);
  const zone = els.find(t => t.classList.contains('drop-zone') && !t.dataset.locked);
  if (zone) doDrop(zone, parseInt(zone.dataset.nr));
  dragNr = null; dragEl = null;
}
document.addEventListener('mousemove', e => {
  if (dragNr !== null) {
    moveGhost(e);
    document.querySelectorAll('.drop-zone').forEach(z => z.classList.remove('drag-over'));
    const els = document.elementsFromPoint(e.clientX, e.clientY);
    const z = els.find(t => t.classList.contains('drop-zone') && !t.dataset.locked);
    if (z) z.classList.add('drag-over');
  }
});
document.addEventListener('touchmove', e => { if (dragNr !== null) moveGhost(e); }, {passive:false});
document.addEventListener('mouseup', e => { if (dragNr !== null) endDrag(e); });
document.addEventListener('touchend', e => { if (dragNr !== null) endDrag(e); });

function doDrop(zone, targetNr) {
  const correct = (dragNr === targetNr);
  const dropped = plaatsen.find(x => x.nr === dragNr);
  const target  = plaatsen.find(x => x.nr === targetNr);

  if (correct) {
    beantwoord.add(targetNr);
    zone.dataset.locked = '1';
    zone.textContent = dropped.naam;
    zone.classList.add('correct');
    const pin = document.getElementById('mpin-' + targetNr);
    if (pin) pin.classList.add('correct-pin');
  }
  if (correct) {
    if (dragEl) dragEl.classList.add('gebruikt');
    scoreGoed++;
    updateScore();
    if (beantwoord.size === 19) toonEinde();
  } else {
    // Wrong: put chip back in bank, reset zone, don't count as answered
    beantwoord.delete(targetNr);
    zone.dataset.locked = '';
    zone.textContent = targetNr;
    zone.classList.remove('incorrect');
    if (dragEl) {
      dragEl.classList.remove('dragging');
      dragEl.classList.remove('gebruikt');
    }

    // Show popup
    const popup = document.getElementById('drop-popup');
    document.getElementById('popup-icon').textContent = '❌';
    document.getElementById('popup-fout').textContent = '"' + dropped.naam + '" hoort hier niet';
    document.getElementById('popup-correct-label').textContent = 'Nummer ' + targetNr + ' is:';
    document.getElementById('popup-correct-naam').textContent = target.naam;
    const rect = zone.getBoundingClientRect();
    popup.style.left = Math.min(rect.left + rect.width/2, window.innerWidth - 220) + 'px';
    popup.style.top  = (rect.top - 10) + 'px';
    popup.style.transform = 'translate(-50%, -100%)';
    popup.style.display = 'block';
    clearTimeout(window._popupTimer);
    window._popupTimer = setTimeout(() => { popup.style.display = 'none'; }, 2800);
  }
  updateScore();
  if (beantwoord.size === 19) toonEinde();
}

/* ══ BUILD SLEPEN ══ */
function bouwSlepen() {
  document.getElementById('btn-check').style.display = 'none';
  const c = document.getElementById('main-content'); c.innerHTML = '';
  const layout = document.createElement('div'); layout.className = 'slepen-layout';

  // Kaart met drop zones
  const ks = document.createElement('div'); ks.className = 'kaart-sectie';

    const dz = document.createElement('div');
    dz.className = 'drop-zone'; dz.dataset.nr = p.nr;
    dz.style.left = p.lx; dz.style.top = p.ly;
    dz.textContent = p.nr;
    dz.title = p.nr;
    dz.addEventListener('mouseenter', function() {
      if (this.dataset.locked) {
        const tooltip = document.getElementById('map-tooltip');
        tooltip.textContent = this.textContent;
        const r = this.getBoundingClientRect();
        tooltip.style.left = (r.left + r.width/2) + 'px';
        tooltip.style.top  = (r.top - 8) + 'px';
        tooltip.style.display = 'block';
      }
    });
    dz.addEventListener('mouseleave', function() {
      document.getElementById('map-tooltip').style.display = 'none';
    });
    kw.appendChild(dz);
  });
  ks.appendChild(kw);
  ks.innerHTML += '<p style="font-size:.75rem;color:#888;margin-top:7px;font-style:italic">💡 Sleep een naam uit de lijst naar het bijbehorende vakje op de kaart</p>';
  layout.appendChild(ks);

  // Naam bank
  const bank = document.createElement('div'); bank.className = 'naam-bank';
  bank.innerHTML = '<h3>🏷️ Plaatsnamen</h3>';
  const cl = document.createElement('div'); cl.className = 'chip-list';
  [...plaatsen].sort(() => Math.random() - .5).forEach(p => {
    const chip = document.createElement('div');
    chip.className = 'naam-chip'; chip.id = 'chip-' + p.nr;
    chip.textContent = p.naam;
    chip.addEventListener('mousedown', e => startDrag(e, p.nr, chip));
    chip.addEventListener('touchstart', e => startDrag(e, p.nr, chip), {passive:false});
    cl.appendChild(chip);
  });
  bank.appendChild(cl); layout.appendChild(bank);
  c.appendChild(layout);
}

/* ══ BUILD INTYPEN ══ */
function bouwIntypen() {
  document.getElementById('btn-check').style.display = 'block';
  const c = document.getElementById('main-content'); c.innerHTML = '';

  // Mini kaart met pins
  const ks = document.createElement('div'); ks.className = 'kaart-mini-sectie';

/* ══ BUILD MEERKEUZE ══ */
function bouwMeerkeuze() {
  document.getElementById('btn-check').style.display = 'none';
  const c = document.getElementById('main-content'); c.innerHTML = '';

  // Mini kaart
  const ks = document.createElement('div'); ks.className = 'kaart-mini-sectie';

/* ══ INTERACTIE ══ */
function controleerEenIntypen(nr) {
  if (beantwoord.has(nr)) return;
  const inp = document.getElementById('inp-' + nr);
  const correct = plaatsen.find(p => p.nr === nr).naam;
  const ok = inp.value.trim().toLowerCase() === correct.toLowerCase();
  inp.classList.add(ok ? 'correct' : 'incorrect'); inp.disabled = true;
  if (!ok) document.getElementById('hint-' + nr).style.display = 'block';
  markeer(nr, ok);
}

function kiesMC(nr, gekozenNr, btn) {
  if (beantwoord.has(nr)) return;
  const correct = nr;
  const ok = gekozenNr === correct;
  document.getElementById('opties-' + nr).querySelectorAll('.optie-btn').forEach(b => {
    b.disabled = true;
    if (parseInt(b.onclick.toString().match(/kiesMC\(\d+,(\d+)/)?.[1]) === correct) b.classList.add('goed');
  });
  btn.classList.add(ok ? 'goed' : 'fout');
  if (!ok) document.getElementById('hint-' + nr).style.display = 'block';
  markeer(nr, ok);
}

function markeer(nr, ok) {
  beantwoord.add(nr);
  const k = document.getElementById('kaart-' + nr);
  if (k) k.classList.add(ok ? 'correct' : 'incorrect');
  const icon = document.getElementById('icon-' + nr);
  if (icon) icon.textContent = ok ? '✅' : '❌';
  const pin = document.getElementById('mpin-' + nr);
  if (pin) pin.classList.add(ok ? 'correct-pin' : 'fout-pin');
  ok ? scoreGoed++ : scoreFout++;
}

function pinKlik(nr) {
  document.querySelectorAll('.mini-pin').forEach(p => p.classList.remove('actief-pin'));
  const pin = document.getElementById('mpin-' + nr); if (pin) pin.classList.add('actief-pin');
  const k = document.getElementById('kaart-' + nr);
  if (k) {
    k.scrollIntoView({behavior:'smooth', block:'center'});
    k.style.boxShadow = '0 0 0 4px var(--oranje)';
    setTimeout(() => { k.style.boxShadow = ''; if(pin) pin.classList.remove('actief-pin'); }, 1500);
    const inp = document.getElementById('inp-' + nr); if (inp && !inp.disabled) setTimeout(() => inp.focus(), 400);
  }
}

function controleerAlles() {
  if (tab === 'intypen') plaatsen.forEach(p => { if (!beantwoord.has(p.nr)) controleerEenIntypen(p.nr); });
}

function toonAntwoorden() {
  if (tab === 'slepen') {
    plaatsen.forEach(p => {
      if (beantwoord.has(p.nr)) return;
      const dz = document.querySelector(`.drop-zone[data-nr="${p.nr}"]`);
      if (dz) { dz.textContent = p.naam; dz.classList.add('correct'); dz.dataset.locked='1'; }
      const chip = document.getElementById('chip-' + p.nr); if (chip) chip.classList.add('gebruikt');
      const pin = document.getElementById('mpin-' + p.nr); if (pin) pin.classList.add('correct-pin');
      beantwoord.add(p.nr); scoreGoed++;
    });
  } else {
    plaatsen.forEach(p => {
      if (beantwoord.has(p.nr)) return;
      const hint = document.getElementById('hint-' + p.nr); if (hint) hint.style.display = 'block';
      if (tab === 'intypen') {
        const inp = document.getElementById('inp-' + p.nr);
        if (inp && !inp.disabled) { inp.value = p.naam; inp.disabled = true; inp.classList.add('correct'); }
      }
      markeer(p.nr, true);
    });
  }
  updateScore();
}

function updateScore() {
  document.getElementById('score-goed').textContent = scoreGoed;
  document.getElementById('score-fout').textContent = scoreFout;
  document.getElementById('score-rest').textContent = 19 - beantwoord.size;
  document.getElementById('progress-fill').style.width = Math.round((scoreGoed/19)*100) + '%';
  document.getElementById('progress-label').textContent = scoreGoed + ' van 19 goed';
}

function toonEinde() {
  const s = document.getElementById('einde-scherm'); s.style.display = 'block';
  document.getElementById('eindcijfer').textContent = scoreGoed + '/19';
  const pct = Math.round((scoreGoed/19)*100);
  document.getElementById('einde-bericht').textContent =
    pct===100?'🌟 Perfecte score! Je kent alle plaatsen!':pct>=80?'🎊 Heel goed!':pct>=60?'👍 Goed bezig!':'💪 Blijf oefenen!';
  s.scrollIntoView({behavior:'smooth'});
}

function setTab(t) {
  tab = t;
  document.querySelectorAll('.tab-btn').forEach((b,i) => b.classList.toggle('actief', ['slepen','intypen','meerkeuze'][i] === t));
  opnieuw();
}

function opnieuw() {
  scoreGoed=0; scoreFout=0; beantwoord=new Set();
  document.getElementById('einde-scherm').style.display='none';
  updateScore();
  if (tab==='slepen') bouwSlepen();
  else if (tab==='intypen') bouwIntypen();
  else bouwMeerkeuze();
  window.scrollTo({top:0,behavior:'smooth'});
}

function shuffle(a) { return [...a].sort(() => Math.random()-.5); }

opnieuw();
</script>
